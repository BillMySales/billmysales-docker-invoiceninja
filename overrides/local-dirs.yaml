# Keep the stack's data in local directories instead of named volumes, so it
# is visible from the host (and easy to include in host-level backups).
#
# In .env:
#   COMPOSE_FILE=compose.yaml:overrides/local-dirs.yaml
#   DATA_DIR=./data        # optional, default ./data (relative to compose.yaml)
#
# Only the directories you keep here change; delete the lines you don't need
# (e.g. keep just `storage` and `backups`). Existing data in the named volumes
# is NOT moved: switch before the first `up`, or restore a backup afterwards.
# `public` holds only files copied from the image (setup copies them again
# when the image changes). `setup` gives `public` and `storage` to www-data
# (UID 33 in the Debian image) on every run, also on Linux. Backup files are
# root-owned with mode 0600.

x-ninja-dirs: &ninja-dirs
  - ${DATA_DIR:-./data}/public:/var/www/html/public
  - ${DATA_DIR:-./data}/storage:/var/www/html/storage
  - ./scripts:/usr/local/share/stack/scripts:ro

services:
  db:
    volumes:
      - ${DATA_DIR:-./data}/db:/var/lib/mysql
  redis:
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
  setup:
    volumes: *ninja-dirs
  app:
    volumes: *ninja-dirs
  worker:
    volumes: *ninja-dirs
  scheduler:
    volumes: *ninja-dirs
  console:
    volumes: *ninja-dirs
  caddy:
    volumes:
      - ${DATA_DIR:-./data}/public:/var/www/html/public:ro
      - ${DATA_DIR:-./data}/storage:/var/www/html/storage:ro
      - ${DATA_DIR:-./data}/caddy/data:/data
      - ${DATA_DIR:-./data}/caddy/config:/config
  backup:
    volumes:
      - ${DATA_DIR:-./data}/storage:/data/storage
      - ${DATA_DIR:-./data}/backups:/backups
